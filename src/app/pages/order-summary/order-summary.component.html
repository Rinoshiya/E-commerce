<aside class="summary">
  <h2>Summary</h2>
  <dl>
    <div><dt>Subtotal</dt><dd>AED {{ subtotal() | number: '1.0-0' }}</dd></div>
    <div><dt>Delivery</dt><dd>{{ shipping() ? 'AED ' + shipping() : 'Free' }}</dd></div>
    @if (discount()) { <div class="disc"><dt>Promo</dt><dd>-AED {{ discount() | number: '1.0-0' }}</dd></div> }
    <div class="total"><dt>Total</dt><dd>AED {{ subtotal() + shipping() - discount() | number: '1.0-0' }}</dd></div>
  </dl>
  @if (showExtras()) {
    <div class="promo"><input pInputText placeholder="Promo code" aria-label="Promo code" /><p-button label="Apply" [outlined]="true" /></div>
    <label class="gift"><p-checkbox [(ngModel)]="giftWrap" [binary]="true" name="gift" /> Add gift wrapping &amp; note</label>
  }
  <ng-content />
</aside>
